services:
  postgres:
    image: postgres:17
    container_name: shekinah-postgres
    environment:
      POSTGRES_DB: shekinah
      POSTGRES_USER: shekinah
      POSTGRES_PASSWORD: shekinah
    ports:
      - "55432:5432"
    volumes:
      - shekinah-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shekinah -d shekinah"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Live streaming server: the app broadcasts to it, members watch from it.
  mediamtx:
    image: bluenviron/mediamtx:1.21.2
    container_name: shekinah-mediamtx
    user: "${SHEKINAH_MEDIA_UID:-1000}:${SHEKINAH_MEDIA_GID:-1000}"
    environment:
      MTX_WEBRTCADDITIONALHOSTS: "${LIVE_WEBRTC_HOSTS:-127.0.0.1}"
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
      - "8189:8189/tcp"
      - "127.0.0.1:9997:9997"
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./.local/recordings:/recordings
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  shekinah-postgres-data:
