# Free plans only. One public service includes the API and web admin.
# Free Render Postgres expires after 30 days: this is an initial trial, and
# requires an export/migration before expiry to retain account/purchase data.
# Existing local data and encryption roots must be migrated before first boot.
services:
  - type: web
    name: shekinah-sons-backend
    branch: deploy/render-r2-free-20261030
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: LIVE_TRANSPORT
        value: r2
      - key: MEDIA_PROVIDER
        value: r2
      - key: MEDIA_REQUIRE_REMOTE_STORAGE
        value: "true"
      - key: LIVE_R2_MAX_BYTES
        value: "5000000000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: LIBRARY_ENCRYPTION_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: R2_SERMONS_BUCKET
        sync: false
      - key: R2_SERMONS_PUBLIC_BASE_URL
        sync: false
      - key: BOOTSTRAP_DATABASE_KEY
        sync: false
      - key: BOOTSTRAP_DATABASE_SHA256
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://shekinah-sons-backend.onrender.com
