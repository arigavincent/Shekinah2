databases:
  - name: shekinah-sons-db
    databaseName: shekinah
    user: shekinah
    plan: free

services:
  - type: web
    name: shekinah-sons-backend
    runtime: go
    rootDir: backend
    plan: free
    buildCommand: go build -o shekinah-api ./cmd/api
    startCommand: ./shekinah-api
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shekinah-sons-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://shekinah2.onrender.com,https://shekinah-sons-admin.onrender.com

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MEDIA_PROVIDER
        value: r2
      - key: MEDIA_REQUIRE_REMOTE_STORAGE
        value: "true"
      - key: R2_ACCOUNT_ID
        value: 23bae8008ee66b558e187831094e5c95
      - key: R2_ENDPOINT
        value: https://23bae8008ee66b558e187831094e5c95.r2.cloudflarestorage.com
      - key: R2_BUCKET
        value: shekinah-media
      - key: R2_PUBLIC_BASE_URL
        value: https://pub-83f19d3b42f142f29254974dbc99b77b.r2.dev
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: https://shekinah-sons-backend.onrender.com/api/v1/giving/mpesa/callback
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline
      - key: MPESA_ACCOUNT_REFERENCE
        value: Shekinah

  - type: web
    name: shekinah-sons-admin
    env: node
    rootDir: admin_dashboard
    buildCommand: npx nypm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NITRO_PRESET
        value: render_com
      - key: VITE_API_BASE_URL
        value: https://shekinah-sons-backend.onrender.com
