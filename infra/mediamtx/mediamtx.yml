# Shekinah live streaming server (MediaMTX).
# The app's broadcaster publishes RTMP to rtmp://<host>:1935/church?key=<session key>;
# viewers watch HLS at http://<host>:8888/church/index.m3u8.
logLevel: info

# Every publish is checked with the backend, which only accepts the key of
# the current live session. Watching is checked too: free lives are open to
# all, a paid live only to members who paid (the app sends their token).
authMethod: http
authHTTPAddress: http://host.docker.internal:3000/api/v1/live/mediamtx-auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

api: true
apiAddress: :9997

rtmp: true
rtmpAddress: :1935

hls: true
hlsAddress: :8888
hlsAllowOrigins: ["*"]
# Low-latency HLS: a few seconds behind the pastor.
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAlwaysRemux: true

rtsp: false
# Browser publishers use WHIP with the same session key and recording pipeline.
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts: [127.0.0.1]
srt: false
moq: false

paths:
  church:
    source: publisher
    overridePublisher: false
    record: true
    recordPath: /recordings/unassigned/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 10m
    # Only the archive worker removes segments after a successful R2 upload.
    recordDeleteAfter: 0s
